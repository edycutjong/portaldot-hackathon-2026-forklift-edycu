name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e '.[dev]'
      # Offline only: pyproject's addopts deselects the `live` tests, which need the public chain or a funded key.
      - run: pytest -q

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - run: pip install dist/*.whl && forklift --help

  # Runs this repo's own composite action (action.yml) against the live V3 testnet: fork at head, verify 20 keys.
  # The job fails with `forklift verify`'s exit code if the fork disagrees with the chain.
  action-smoke:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: fork
        uses: ./
        with:
          command: verify
          sample: "20"
      - name: Show what the action reported
        run: 'echo "forked V3 at #${{ steps.fork.outputs.fork-block }}, forklift verify exit ${{ steps.fork.outputs.exit-code }}"'
