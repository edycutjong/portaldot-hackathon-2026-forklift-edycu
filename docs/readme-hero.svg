<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Forklift — lifts the Portaldot V3 testnet onto your bench, writable: Two fork tines slide under block #118,061, lift it off the V3 rack, and it lands on your bench, writable.">
<!-- STORYBOARD (dur 8s — must equal this file's single master dur)
  0-10%   steady state: yellow plate; FORKLIFT wordmark, tagline, metric, stack; the V3 rack holding block #118,061 (steel outline), MMR crates below, the empty hazard-edged bench — the poster
  10-22%  trigger:      the tines slide into the pallet's fork pockets                                                        data-story="beat-2"
  22-55%  mechanism:    Two fork tines slide under block #118,061, lift it off the V3 rack, and it lands on your bench, writable.   (the unit rides the lift arc from rack to bench; a steel ghost stays on the rack — V3 keeps its copy)   data-story="beat-3"
  55-90%  resolution:   landed with a settle; the load fills lift-blue, the blue floor light pools, the plate reads "5,508 KEYS · WRITABLE"   data-story="beat-4"
  90-100% breathe + seam fade: the unit fades off the bench and reappears on the rack (hidden jump), back to the poster
-->
<style>
  .settle { transform-box: fill-box; transform-origin: center bottom; animation: settle 8s cubic-bezier(.2,1.4,.4,1) infinite; }
  @keyframes settle { 0%, 49% { transform: translateY(0) } 51.5% { transform: translateY(5px) } 54%, 100% { transform: translateY(0) } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
