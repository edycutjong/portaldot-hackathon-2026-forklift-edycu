  <pattern id="hz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="16" fill="#1E1F1C"/></pattern>
  <path id="arc" d="M690 148 C 790 30, 1010 40, 1124 224"/>
</defs>
