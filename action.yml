name: Forklift fork check
description: >-
  Fork the Portaldot V3 testnet at a pinned block with Forklift, then gate the job on `forklift verify`
  or on a `forklift rehearse` of one call. The job fails with the command's own exit code.
author: edycutjong
branding:
  icon: package
  color: yellow

inputs:
  command:
    description: "`verify` (check the fork against the live chain) or `rehearse` (predict one call on the fork)."
    default: verify
  at:
    description: "Block to fork: a number, a 0x block hash, or `head` (latest finalized)."
    default: head
  sample:
    description: "`verify` only: keys drawn from the live chain (1 to 100000)."
    default: "200"
  call:
    description: "`rehearse` only: the call to predict, Pallet.call (e.g. System.remark)."
    default: ""
  args:
    description: "`rehearse` only: the call arguments as a JSON object."
    default: "{}"
  signer-file:
    description: >-
      `rehearse` only: path to a seed file (mode 600) that you wrote from a secret in an earlier step.
      The prediction runs on the fork; nothing is sent to V3.
    default: ""
  ws-port:
    description: WebSocket port of the Chopsticks fork on the runner.
    default: "59944"
  python-version:
    description: Python used to install Forklift (3.11 or newer).
    default: "3.12"
  node-version:
    description: Node.js used to run Chopsticks (18 or newer).
    default: "22"

outputs:
  exit-code:
    description: "Exit code of the forklift command (0 ok; see docs/EXIT-CODES.md)."
    value: ${{ steps.run.outputs.exit-code }}
  fork-block:
    description: Block number the fork started at.
    value: ${{ steps.run.outputs.fork-block }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install Forklift from this action's own checkout
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --quiet "$ACTION_PATH" && forklift --version

    - name: Fork V3, run the command, stop the fork
      id: run
      shell: bash
      env:
        FK_COMMAND: ${{ inputs.command }}
        FK_AT: ${{ inputs.at }}
        FK_SAMPLE: ${{ inputs.sample }}
        FK_CALL: ${{ inputs.call }}
        FK_ARGS: ${{ inputs.args }}
        FK_SIGNER: ${{ inputs.signer-file }}
        FK_PORT: ${{ inputs.ws-port }}
      run: |
        set -uo pipefail
        case "$FK_COMMAND" in
          verify) ;;
          rehearse)
            [ -n "$FK_CALL" ] || { echo "::error::command=rehearse needs the call input"; exit 64; }
            [ -n "$FK_SIGNER" ] || { echo "::error::command=rehearse needs the signer-file input"; exit 64; } ;;
          *) echo "::error::command must be verify or rehearse, got '$FK_COMMAND'"; exit 64 ;;
        esac

        cleanup() { forklift down --name v3 >/dev/null 2>&1 || true; }
        trap cleanup EXIT

        forklift up --target v3 --at "$FK_AT" --name v3 --ws-port "$FK_PORT" | tee up.log
        up_code=${PIPESTATUS[0]}
        if [ "$up_code" -ne 0 ]; then
          echo "exit-code=$up_code" >> "$GITHUB_OUTPUT"
          echo "::error::forklift up exited $up_code"
          exit "$up_code"
        fi
        block=$(sed -n 's/^lift .*· #\([0-9,]*\) .*/\1/p' up.log | head -1 | tr -d ',')
        echo "fork-block=$block" >> "$GITHUB_OUTPUT"

        if [ "$FK_COMMAND" = verify ]; then
          forklift verify --name v3 --sample "$FK_SAMPLE"
        else
          forklift rehearse "$FK_CALL" --args "$FK_ARGS" --signer "$FK_SIGNER" --name v3
        fi
        code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        if [ "$code" -ne 0 ]; then
          echo "::error::forklift $FK_COMMAND exited $code (docs/EXIT-CODES.md)"
        fi
        exit "$code"
